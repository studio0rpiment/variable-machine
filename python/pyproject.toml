[project]
name = "variable-machine"
version = "0.1.0"
description = "The training environment for Variable Machine. Invoked only by the helper, as subprocesses."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mlx-lm>=0.32.2"]

[project.optional-dependencies]
# Models that see (SmolVLM): mlx-vlm trains them, gguf writes the trained
# weights back into the GGUF Ollama runs. About 800MB more, so only installed
# when a picture dataset is first trained (uv run --extra sees).
sees = ["mlx-vlm>=0.7.10", "gguf>=0.19.0"]
# Voice (Soprano speaks, Whisper listens): mlx-audio, installed the first time
# the Voice tab speaks or listens (uv run --extra voice).
voice = ["mlx-audio>=0.6.1"]
# Image moods: SigLIP's image and text encoders as ONNX files, run by
# onnxruntime (a 21MB download, 75MB installed), with Pillow to read the photos. The classifier
# trained on top is plain numpy.
mood = ["onnxruntime>=1.31.1", "pillow>=11.0"]
# The latent image: Kandinsky 2.2's image encoder and decoder in torch, on the
# Mac's GPU (MPS); peft trains the decoder's LoRA. About 1 GB installed, and the
# model itself (model get kandinsky) is 9 GB, so it needs a 16 GB Mac.
latent = ["torch>=2.15.0", "diffusers>=0.42.1", "transformers>=5.22.1", "peft>=0.21.2", "safetensors>=0.5", "pillow>=11.0"]

[tool.uv]
package = false
