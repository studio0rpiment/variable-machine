[project]
name = "variable-machine"
version = "0.1.0"
description = "The training environment for Variable Machine. Invoked only by the helper, as subprocesses."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mlx-lm>=0.32.2"]

[project.optional-dependencies]
# Models that see (SmolVLM): mlx-vlm trains them, gguf writes the trained
# weights back into the GGUF Ollama runs. About 800MB more, so only installed
# when a picture dataset is first trained (uv run --extra sees).
sees = ["mlx-vlm>=0.7.10", "gguf>=0.19.0"]

[tool.uv]
package = false
